<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Argos">
  <!-- Uygulamanın kendi imzası: kategori halkası. Bir göz çizmek adın
       ("yüz gözlü nöbetçi") karşılığıydı ama ekranda böyle bir şey yok;
       ikon uygulamayı açmadan önce onu tanıtmalı, adını değil.
       Renkler paletin kendisi, dilim payları örnek bir günün dağılımı. -->
  <rect width="512" height="512" rx="112" fill="#0e111a" />
  <g fill="none" stroke-width="58" stroke-linecap="butt">
    <circle cx="256" cy="256" r="140" stroke="#232837" />
    <!-- Çevre 2πr = 879.6; dilimler bu uzunluk üzerinden bölünüyor.
         Aralardaki 8 birimlik kesinti zemini gösterip sınırı ayırıyor. -->
    <circle cx="256" cy="256" r="140" stroke="#5b96f5"
            stroke-dasharray="322 558" stroke-dashoffset="220"
            transform="rotate(-90 256 256)" />
    <circle cx="256" cy="256" r="140" stroke="#d5a52c"
            stroke-dasharray="242 638" stroke-dashoffset="-110"
            transform="rotate(-90 256 256)" />
    <circle cx="256" cy="256" r="140" stroke="#f08246"
            stroke-dasharray="163 717" stroke-dashoffset="-360"
            transform="rotate(-90 256 256)" />
    <circle cx="256" cy="256" r="140" stroke="#35bb8c"
            stroke-dasharray="105 775" stroke-dashoffset="-531"
            transform="rotate(-90 256 256)" />
  </g>
</svg>
