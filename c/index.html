<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Argos</title>
    <meta name="description" content="Alışkanlık, harcama ve abonelik takibi" />

    <!-- Telefonda ana ekrana eklenince tam ekran açılsın. iOS manifest'i
         okumuyor; `apple-*` etiketleri onun karşılığı. -->
    <link rel="manifest" href="uygulama.webmanifest" />
    <link rel="icon" href="ikon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="ikon-180.png" />
    <!-- İkisi birden: `apple-*` biçimi kullanımdan kalkıyor ama iOS'un
         eski sürümleri hâlâ yalnız onu tanıyor. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Argos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Tarayıcı çubuğu sayfanın zeminiyle aynı renkte. İki tema için iki
         değer: tek değer verilseydi açık temada koyu bir şerit kalırdı. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eaf0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e111a" />

    <!-- Tema, ilk boyamadan ÖNCE seçilir. CSS'te iki ayrı token bloğu
         tutmak (bir @media, bir [data-tema]) ikisinin zamanla ayrışması
         demekti; tek blok bırakıp seçimi buraya almak o riski kaldırıyor.
         Ayrıca ?tema=koyu / ?tema=acik ile zorlanabilir: koyu tema bu
         tasarımın ana yüzü ve her doğrulamada elle görülebilmeli. -->
    <script>
      (function () {
        var kok = document.documentElement;
        var sorgu = new URLSearchParams(location.search).get('tema');
        var medya = matchMedia('(prefers-color-scheme: dark)');
        var uygula = function () {
          kok.dataset.tema = (sorgu ? sorgu === 'koyu' : medya.matches) ? 'koyu' : 'acik';
        };
        uygula();
        if (!sorgu) medya.addEventListener('change', uygula);
      })();
    </script>

    <!-- Tek aile, üç ses. Genişlik ekseni (wdth 62..125) ikinci bir yazı
         ailesinin işini yapar: 62 = etiket ve ham veri, 100..110 = sayı,
         118 = yorum cümlesi. B'den alındı; iki tasarımın en ucuz fikri.
         GÖMÜLÜ: çevrimdışı bir PWA'da CDN'den gelen yazı tipi düşer ve
         üç sesin tamamı tek sese iner. -->
    <link rel="preload" href="yazi/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="yazi/yazi.css" />
    <link rel="stylesheet" href="stil.css" />
  </head>

  <body data-kip="gunduz">
    <div class="sayfa">
      <header class="ust">
        <span class="ust-tarih" id="tarih"></span>
        <!-- Kip rozeti üst şeritte durur, blok içinde değil: "GÜNÜ KAPAT"
             başlığı bloğa konsaydı akşam alışkanlık kartlarından 15px
             yerdi ve 72px dokunma hedefi sıkışırdı. Üst şeritte bedava. -->
        <span class="ust-kip" id="kip"></span>
        <span class="ust-saat" id="saat"></span>
      </header>

      <main id="ekran" aria-busy="true">
        <section class="blok">
          <p class="etiket">BUGÜN</p>
          <p class="yorum">Gün açılıyor.</p>
        </section>
      </main>
    </div>

    <script type="module" src="ana.js"></script>

    <!-- Service worker YALNIZ güvenli bağlamda kaydolur. Yerel ağdan
         (http://192.168.x.x) açıldığında tarayıcı zaten reddeder; sessizce
         geçmek yerine sebebi konsola yazılıyor, yoksa "neden kurulmuyor"
         sorusu her seferinde yeniden araştırılıyor. -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) {
          // Güvensiz bağlamda tarayıcı bu API'yi hiç tanımlamaz. Sessizce
          // geçmek yerine sebebi yazılıyor; yoksa "neden kurulmuyor" sorusu
          // her seferinde yeniden araştırılıyor.
          console.warn(
            '[argos] service worker yok' +
              (isSecureContext ? '' : ' — güvenli bağlam değil (HTTPS ya da localhost gerekir)') +
              '; çevrimdışı kabuk devre dışı, uygulama yine çalışır'
          );
          return;
        }
        var kaydet = function () {
          navigator.serviceWorker.register('sw.js').catch(function (hata) {
            console.warn('[argos] service worker kaydolmadı:', hata.message);
          });
        };
        // `load` çoktan geçmiş olabilir; o durumda dinleyici hiç tetiklenmez.
        if (document.readyState === 'complete') kaydet();
        else addEventListener('load', kaydet);
      })();
    </script>
  </body>
</html>
