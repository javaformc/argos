<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e7e2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)" />
    <title>Argos B</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tek aile, üç ses. Genişlik ekseni (wdth 62..125) Oura'nın serif/sans
         ayrımının işini yapar: 62 = etiket ve ham veri, 100 = büyük sayı,
         118 = yorum cümlesi. İkinci bir yazı ailesi gerekmez. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stil.css" />
  </head>

  <body data-kip="gunduz">
    <div class="sayfa">
      <!-- Üst şerit kartsız tek satır: tarih yer kaplamasın ama gerçek
           tarih de görünsün. -->
      <header class="ust">
        <span class="ust-tarih" id="tarih"></span>
        <span class="ust-saat" id="saat"></span>
      </header>

      <main id="ekran" aria-busy="true">
        <section class="blok">
          <p class="etiket">BUGÜN</p>
          <p class="yorum">Gün açılıyor.</p>
        </section>
      </main>
    </div>

    <script type="module" src="ana.js"></script>
  </body>
</html>
